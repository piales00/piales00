<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 114" width="900" height="114" role="img" aria-label="Stack: SuiteScript 2.x, JavaScript, Python, FastAPI, Node.js, PostgreSQL, Docker, Git">
<style>
text { font: 13px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.art, .cell { opacity: 0; animation: in .5s ease-out forwards; }
.art, .val { fill: #c9d1d9; }
.key { fill: #a78bfa; }
.b { font-weight: 700; }
.dim { fill: #8b949e; }
.cyan { fill: #67e8f9; }
.cursor { fill: #a78bfa; animation: blink 1.1s steps(1) infinite; }
@keyframes in { to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .art, .cell { animation: none; opacity: 1; } .cursor { animation: none; } }
</style>
