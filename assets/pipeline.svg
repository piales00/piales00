<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Agent pipeline: explore → propose → spec + design → tasks → apply → verify → archive">
<style>
text { font: 13px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
.art, .cell { opacity: 0; animation: in .5s ease-out forwards; }
.art, .val { fill: #c9d1d9; }
.key { fill: #a78bfa; }
.b { font-weight: 700; }
.dim { fill: #8b949e; }
.cyan { fill: #67e8f9; }
.cursor { fill: #a78bfa; animation: blink 1.1s steps(1) infinite; }
.node { animation: run 8s linear infinite; }
.flow { stroke-dasharray: 3 5; animation: flow .8s linear infinite; }
@keyframes in { to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes run { 0%, 14%, 100% { fill-opacity: .05; stroke-opacity: .45; } 3%, 10% { fill-opacity: .4; stroke-opacity: 1; } }
@keyframes flow { to { stroke-dashoffset: -8; } }
@media (prefers-reduced-motion: reduce) { .art, .cell { animation: none; opacity: 1; } .cursor, .node, .flow { animation: none; } }
</style>
<defs>
<clipPath id="clip"><rect x="6" y="6" width="888" height="138" rx="12"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<linearGradient id="edge" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
<rect width="900" height="150" fill="#0a0c12"/>
<g filter="url(#blur)" opacity=".5"><circle cx="792" cy="128" r="90" fill="#7c3aed"/><circle cx="495" cy="15" r="90" fill="#22d3ee"/><circle cx="270" cy="142" r="90" fill="#db2777"/></g>
<rect width="900" height="150" fill="#0d1117" opacity=".6"/>
</g>
<rect x="6" y="6" width="888" height="138" rx="12" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
<text x="28.0" y="40.0" class="key">❯</text>
